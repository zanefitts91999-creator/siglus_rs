name: Build Switch NRO (Optimized)

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

jobs:
  switch:
    name: Build Switch NRO
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/xmoezzz/siglus_rs/switch-build:latest
    env:
      RUSTFLAGS: ""
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NRO and NSO
        run: |
          make -C platform/switch/runtime
          mkdir -p dist/switch
          cp platform/switch/runtime/siglus_switch.nro dist/switch/siglus-switch.nro
          cp platform/switch/runtime/siglus_switch.nso dist/switch/main

      - name: Upload Switch artifacts
        uses: actions/upload-artifact@v4
        with:
          name: siglus-switch-binaries
          path: |
            dist/switch/siglus-switch.nro
            dist/switch/main
          if-no-files-found: error
